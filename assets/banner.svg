<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <!-- Glowing Orbs Gradients -->
    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94a3b8;
      }
      .tagline-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 14px;
        fill: #38bdf8;
        letter-spacing: 2px;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #e2e8f0;
      }

      /* Animated Glowing Nodes & Particle Flows */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-12px) scale(1.05); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(14px) scale(0.96); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; filter: blur(35px); }
        50% { opacity: 0.6; filter: blur(45px); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -120; }
      }

      .floating-orb-1 { animation: floatSlow 7s ease-in-out infinite, pulseGlow 5s ease-in-out infinite; }
      .floating-orb-2 { animation: floatReverse 8s ease-in-out infinite, pulseGlow 6s ease-in-out infinite; }
      .data-flow-line {
        stroke-dasharray: 6 8;
        animation: dashMove 4s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/>
  <rect width="1200" height="420" fill="url(#grid)" opacity="0.8" rx="16"/>

  <!-- Dynamic / Animated Background Orbs (kept behind foreground text) -->
  <circle class="floating-orb-1" cx="200" cy="120" r="140" fill="url(#orbCyan)"/>
  <circle class="floating-orb-2" cx="1020" cy="280" r="160" fill="url(#orbViolet)"/>
  <circle class="floating-orb-1" cx="960" cy="90" r="110" fill="url(#orbEmerald)"/>

  <!-- Dynamic Animated Flow Streams in Background -->
  <g opacity="0.45">
    <path class="data-flow-line" d="M 80 80 Q 300 20 600 80 T 1120 70" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path class="data-flow-line" d="M 80 340 Q 400 390 700 330 T 1120 350" fill="none" stroke="#a855f7" stroke-width="2"/>
    <path class="data-flow-line" d="M 150 200 C 400 130 800 270 1050 200" fill="none" stroke="#10b981" stroke-width="1.5"/>
  </g>

  <!-- Corner Border Accents -->
  <rect x="2" y="2" width="1196" height="416" rx="14" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Foreground Center Content (Guaranteed crisp and never occluded) -->
  <g transform="translate(600, 70)" text-anchor="middle">
    <!-- Category Badge -->
    <rect x="-180" y="0" width="360" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
    <text x="0" y="19" class="tagline-text">ENTERPRISE SEARCH &amp; DOCUMENT INDEXING</text>

    <!-- Main Title -->
    <text x="0" y="82" class="title-text" fill="url(#titleGrad)">Awesome Enterprise Search</text>

    <!-- Subtitle -->
    <text x="0" y="128" class="subtitle-text">Permission-Aware Workplace Retrieval • Hybrid Vector &amp; Lexical Indexing • Enterprise RAG</text>
  </g>

  <!-- Feature Interactive/Pill Cards in Foreground -->
  <g transform="translate(130, 260)">
    <!-- Pill 1: Hybrid BM25 & Dense Vectors -->
    <g transform="translate(0, 0)">
      <rect width="215" height="46" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="24" cy="23" r="7" fill="#38bdf8"/>
      <text x="42" y="28" class="pill-text">⚡ Hybrid BM25 + Vector</text>
    </g>

    <!-- Pill 2: Permission-Aware ACLs -->
    <g transform="translate(240, 0)">
      <rect width="225" height="46" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="24" cy="23" r="7" fill="#818cf8"/>
      <text x="42" y="28" class="pill-text">🔒 RBAC &amp; Permission ACLs</text>
    </g>

    <!-- Pill 3: Multimodal Document Parsing -->
    <g transform="translate(490, 0)">
      <rect width="220" height="46" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="24" cy="23" r="7" fill="#c084fc"/>
      <text x="42" y="28" class="pill-text">📄 Multimodal OCR / PDF</text>
    </g>

    <!-- Pill 4: Sovereign Self-Hosted & SaaS -->
    <g transform="translate(735, 0)">
      <rect width="205" height="46" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="24" cy="23" r="7" fill="#10b981"/>
      <text x="42" y="28" class="pill-text">🛡️ Sovereign &amp; SaaS RAG</text>
    </g>
  </g>

  <!-- Bottom Metric / Status Bar -->
  <g transform="translate(600, 360)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#64748b">
      Curated List of Commercial Platforms &amp; Open-Source Projects • Constantly Maintained for 2026+
    </text>
  </g>
</svg>
