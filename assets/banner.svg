<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <!-- Soft Radial Glow Gradients (No CSS filter:blur) -->
    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Vibrant Title Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Native SVG Drop Shadow Filter for Cards -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/>
  <rect width="1200" height="420" fill="url(#grid)" opacity="0.8" rx="16"/>

  <!-- Static Glowing Orbs (Pure SVG radial gradients for 100% Camo reliability) -->
  <circle cx="200" cy="120" r="170" fill="url(#orbCyan)"/>
  <circle cx="1020" cy="270" r="180" fill="url(#orbViolet)"/>
  <circle cx="960" cy="90" r="130" fill="url(#orbEmerald)"/>

  <!-- Dynamic / Flow Lines with SMIL Stroke Dash Animations (supported across SVG renderers) -->
  <g opacity="0.55">
    <!-- Stream Line 1 -->
    <path d="M 60 70 Q 300 20 600 70 T 1140 60" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 12">
      <animate attributeName="stroke-dashoffset" from="0" to="-200" dur="10s" repeatCount="indefinite"/>
    </path>
    <!-- Stream Line 2 -->
    <path d="M 60 340 Q 400 390 700 330 T 1140 350" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="8 12">
      <animate attributeName="stroke-dashoffset" from="0" to="200" dur="12s" repeatCount="indefinite"/>
    </path>
    <!-- Stream Line 3 -->
    <path d="M 120 200 C 400 130 800 270 1080 200" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Glowing Pulses along Stream 1 -->
  <circle cx="320" cy="38" r="3.5" fill="#38bdf8">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="860" cy="62" r="3" fill="#818cf8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="365" r="3.5" fill="#c084fc">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Rounded Outer Border -->
  <rect x="2" y="2" width="1196" height="416" rx="14" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Foreground Header Section -->
  <g transform="translate(600, 65)">
    <!-- Category Pill Tag -->
    <rect x="-190" y="0" width="380" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
    <text x="0" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" font-size="13" fill="#38bdf8" letter-spacing="1.5">
      ENTERPRISE SEARCH &amp; DOCUMENT INDEXING
    </text>

    <!-- Main Title -->
    <text x="0" y="82" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="44" fill="url(#titleGrad)" letter-spacing="-0.5">
      Awesome Enterprise Search
    </text>

    <!-- Subtitle -->
    <text x="0" y="126" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400" font-size="18" fill="#94a3b8">
      Permission-Aware Workplace Retrieval • Hybrid Vector &amp; Lexical Indexing • Enterprise RAG
    </text>
  </g>

  <!-- Feature Pill Cards in Foreground -->
  <g transform="translate(130, 255)">
    <!-- Card 1: Hybrid BM25 & Dense Vectors -->
    <g transform="translate(0, 0)" filter="url(#cardShadow)">
      <rect width="215" height="48" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7"/>
      <circle cx="24" cy="24" r="7" fill="#38bdf8"/>
      <text x="42" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">
        ⚡ Hybrid BM25 + Vector
      </text>
    </g>

    <!-- Card 2: Permission-Aware ACLs -->
    <g transform="translate(240, 0)" filter="url(#cardShadow)">
      <rect width="225" height="48" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.7"/>
      <circle cx="24" cy="24" r="7" fill="#818cf8"/>
      <text x="42" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">
        🔒 RBAC &amp; Permission ACLs
      </text>
    </g>

    <!-- Card 3: Multimodal Document Parsing -->
    <g transform="translate(490, 0)" filter="url(#cardShadow)">
      <rect width="220" height="48" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.7"/>
      <circle cx="24" cy="24" r="7" fill="#c084fc"/>
      <text x="42" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">
        📄 Multimodal OCR / PDF
      </text>
    </g>

    <!-- Card 4: Sovereign Self-Hosted & SaaS -->
    <g transform="translate(735, 0)" filter="url(#cardShadow)">
      <rect width="205" height="48" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.7"/>
      <circle cx="24" cy="24" r="7" fill="#10b981"/>
      <text x="42" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">
        🛡️ Sovereign &amp; SaaS RAG
      </text>
    </g>
  </g>

  <!-- Bottom Subtitle / Metric Text -->
  <g transform="translate(600, 365)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">
      Curated List of Commercial Platforms &amp; Open-Source Projects • Constantly Maintained for 2026+
    </text>
  </g>
</svg>
